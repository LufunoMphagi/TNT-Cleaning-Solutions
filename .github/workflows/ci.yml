name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Browser JavaScript syntax
        run: node --check public/app.js
      - name: Type checking
        run: npx tsc --noEmit
      - name: Booking and access integration tests
        run: node tests/integration.mjs
      - name: Production build
        run: npm run build
